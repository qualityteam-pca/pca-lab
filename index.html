<style>
:root{--n:#0f1c3a;--b:#1d4ed8;--bg:#f1f5fb;--bd:#d9e1ef}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:#0f1c3a;display:flex;min-height:100vh}
aside{width:220px;background:var(--n);color:#c9d5ee;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
aside img{width:54px;height:54px;border-radius:50%;display:block;margin:4px 8px}
aside h1{font-size:13px;color:#fff;margin:6px 8px 12px;letter-spacing:.5px}
aside p{font-size:11px;letter-spacing:1px;margin:14px 8px 4px;color:#7f93bd}
aside a{display:block;padding:8px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
aside a.on,aside a:hover{background:var(--b);color:#fff}
section{flex:1;min-width:0;padding:16px 20px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h2{margin:0;font-size:20px;text-transform:uppercase;letter-spacing:.5px}
.band{background:var(--n);color:#fff;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.band img{width:64px;height:64px;border-radius:50%}.band h1{margin:0;font-size:22px;letter-spacing:.5px}.band h3{margin:2px 0 0;font-size:15px;color:#9db7ff}
.band .dr{margin-left:auto;background:#fff;color:var(--n);padding:8px 12px;border-radius:10px;display:grid;gap:4px}
.qg{display:grid;grid-template-columns:190px minmax(0,1fr) 280px;gap:14px;align-items:start}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.k3 .box{text-align:center;margin:0}.k3 h4{margin:0;letter-spacing:1px}.k3 b{font-size:34px}
.box{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.box h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.5px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
label{font-size:12px;color:#475569;display:grid;gap:4px}
input,select{padding:8px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;width:100%;background:#fff}
.btn{background:var(--b);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit}
.btn.o{background:#fff;color:var(--n);border:1px solid #cbd5e1}.btn.d{background:#dc2626;padding:4px 9px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs .btn{background:#fff;color:var(--n);border:1px solid #cbd5e1}.tabs .btn.on{background:var(--b);color:#fff}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}

.t{padding:2px 8px;border-radius:6px;font-weight:600}.p{background:#dcfce7;color:#15803d}.f{background:#fee2e2;color:#b91c1c}

.hb i{font-style:normal;color:#fff;font-size:11px;text-align:center;padding:4px 0;min-width:18px}
.vb{display:flex;gap:6px;align-items:flex-end;height:200px;overflow-x:auto;padding-top:6px}
.vb div{flex:1;min-width:22px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;text-align:center}
.vb i{width:70%;background:var(--b);display:block;border-radius:3px 3px 0 0}
